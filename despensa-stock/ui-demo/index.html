<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1F7A4C" />
  <title>Despensa el Trébol — Demo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="shell">
    <!-- Sidebar desktop/tablet ≥768px -->
    <aside class="sidebar" aria-label="Navegación">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">DT</span>
        <span class="brand-name">Despensa el Trébol</span>
      </div>
      <nav class="side-nav">
        <button type="button" class="nav-item is-active" data-nav="home" aria-current="page">
          <span class="nav-icon" aria-hidden="true">I</span>
          <span class="nav-label">Inicio</span>
        </button>
        <button type="button" class="nav-item" data-nav="sell">
          <span class="nav-icon" aria-hidden="true">V</span>
          <span class="nav-label">Vender</span>
        </button>
        <button type="button" class="nav-item" data-nav="products">
          <span class="nav-icon" aria-hidden="true">D</span>
          <span class="nav-label">Depósito</span>
        </button>
        <button type="button" class="nav-item" data-nav="alerts">
          <span class="nav-icon" aria-hidden="true">A</span>
          <span class="nav-label">Avisos</span>
        </button>
        <button type="button" class="nav-item" data-nav="reports">
          <span class="nav-icon" aria-hidden="true">R</span>
          <span class="nav-label">Reportes</span>
        </button>
      </nav>
    </aside>

    <div class="main-wrap">
      <header class="topbar">
        <p class="topbar-brand">Despensa el Trébol</p>
        <h1 class="topbar-title" id="page-title">Inicio</h1>
      </header>

      <main id="app" class="app">
        <!-- INICIO — Home operativo (DS-DEMO-11) -->
        <section id="view-home" class="view active" aria-label="Inicio">
          <div class="home-work">
            <!-- Mini-reporte hoy (visible; mobile: arriba) -->
            <div class="home-mini-report card card-compact" id="home-mini-report">
              <h2 class="card-title card-title-sm">Hoy</h2>
              <p class="summary-value" id="home-summary">Sin ventas todavía</p>
            </div>

            <!-- Venta embebida (patrón POS DS-DEMO-07) -->
            <div class="home-sell card">
              <h2 class="card-title">Vender</h2>
              <div class="pos-split pos-split-compact">
                <div class="pos-left">
                  <div class="scanner-row">
                    <label class="sr-only" for="home-scan-input">Código de barras</label>
                    <input
                      type="text"
                      id="home-scan-input"
                      class="typeahead-input scan-input"
                      placeholder="Código o Enter…"
                      autocomplete="off"
                      enterkeyhint="done"
                      inputmode="numeric"
                    />
                    <button type="button" class="btn btn-scan-mini" id="home-btn-scan">
                      Simular escaneo
                    </button>
                  </div>
                  <div class="typeahead">
                    <label class="sr-only" for="home-sell-search">Buscar producto</label>
                    <input
                      type="search"
                      id="home-sell-search"
                      class="typeahead-input"
                      placeholder="Buscar producto…"
                      autocomplete="off"
                      enterkeyhint="search"
                    />
                    <div id="home-sell-results" class="typeahead-results typeahead-results-compact" role="listbox" aria-label="Productos"></div>
                  </div>
                </div>
                <div class="pos-right">
                  <div class="cart-panel cart-panel-compact">
                    <h3 class="cart-title">Carrito</h3>
                    <div id="home-cart-lines" class="cart-lines"></div>
                    <div class="cart-footer">
                      <p class="cart-total" id="home-cart-total">$0</p>
                      <div class="cart-actions">
                        <button type="button" class="btn btn-primary btn-hero" id="home-btn-confirm-sale" disabled>
                          Confirmar venta
                        </button>
                        <button type="button" class="btn btn-secondary" id="home-btn-clear-cart" disabled>
                          Vaciar
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- Stock bajo / A reponer -->
            <div class="home-restock card">
              <h2 class="card-title">A reponer</h2>
              <div id="home-restock-list"></div>
              <button type="button" class="link-more" id="home-restock-more" data-nav="alerts" hidden>
                Ver todos
              </button>
            </div>
          </div>

          <button type="button" class="btn-reset" id="btn-reset" title="Vuelve el stock y las ventas al inicio">
            Reiniciar demo
          </button>
        </section>

        <!-- VENDER (POS split full — DS-DEMO-07) -->
        <section id="view-sell" class="view" aria-label="Vender" hidden>
          <div class="pos-split">
            <div class="pos-left">
              <div class="scanner-row">
                <label class="sr-only" for="scan-input">Código de barras</label>
                <input
                  type="text"
                  id="scan-input"
                  class="typeahead-input scan-input"
                  placeholder="Código o Enter…"
                  autocomplete="off"
                  enterkeyhint="done"
                  inputmode="numeric"
                />
                <button type="button" class="btn btn-scan-mini" id="btn-scan">
                  Simular escaneo
                </button>
              </div>

              <div class="typeahead">
                <label class="sr-only" for="sell-search">Buscar producto</label>
                <input
                  type="search"
                  id="sell-search"
                  class="typeahead-input"
                  placeholder="Buscar producto…"
                  autocomplete="off"
                  enterkeyhint="search"
                />
                <div id="sell-results" class="typeahead-results" role="listbox" aria-label="Productos"></div>
              </div>
            </div>

            <div class="pos-right">
              <div class="cart-panel">
                <h2 class="cart-title">Carrito</h2>
                <div id="cart-lines" class="cart-lines"></div>
                <div class="cart-footer sticky-cart">
                  <p class="cart-total" id="cart-total">$0</p>
                  <div class="cart-actions">
                    <button type="button" class="btn btn-primary btn-hero" id="btn-confirm-sale" disabled>
                      Confirmar venta
                    </button>
                    <button type="button" class="btn btn-secondary" id="btn-clear-cart" disabled>
                      Vaciar
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>

        <!-- PRODUCTOS -->
        <section id="view-products" class="view" aria-label="Depósito" hidden>
          <div class="typeahead">
            <label class="sr-only" for="products-search">Buscar en depósito</label>
            <input
              type="search"
              id="products-search"
              class="typeahead-input"
              placeholder="Buscar en depósito…"
              autocomplete="off"
              enterkeyhint="search"
            />
          </div>
          <div id="products-list" class="products-grid" role="list"></div>
        </section>

        <!-- AVISOS -->
        <section id="view-alerts" class="view" aria-label="Avisos" hidden>
          <div class="card">
            <h2 class="card-title">A reponer</h2>
            <div id="restock-list"></div>
          </div>
        </section>

        <!-- REPORTES -->
        <section id="view-reports" class="view" aria-label="Reportes" hidden>
          <div class="card">
            <h2 class="card-title">Hoy</h2>
            <p class="report-summary" id="report-summary"></p>
            <ul id="sales-list" class="sales-list"></ul>
          </div>
        </section>
      </main>
    </div>

    <!-- Bottom nav mobile <768px -->
    <nav class="bottom-nav" aria-label="Navegación principal">
      <button type="button" class="nav-item is-active" data-nav="home" aria-current="page">
        <span class="nav-icon" aria-hidden="true">I</span>
        <span class="nav-label">Inicio</span>
      </button>
      <button type="button" class="nav-item" data-nav="sell">
        <span class="nav-icon" aria-hidden="true">V</span>
        <span class="nav-label">Vender</span>
      </button>
      <button type="button" class="nav-item" data-nav="products">
        <span class="nav-icon" aria-hidden="true">D</span>
        <span class="nav-label">Depósito</span>
      </button>
      <button type="button" class="nav-item" data-nav="alerts">
        <span class="nav-icon" aria-hidden="true">A</span>
        <span class="nav-label">Avisos</span>
      </button>
      <button type="button" class="nav-item" data-nav="reports">
        <span class="nav-icon" aria-hidden="true">R</span>
        <span class="nav-label">Reportes</span>
      </button>
    </nav>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="app.js"></script>
</body>
</html>
